name: photo-gallery

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: photo_gallery
      POSTGRES_USER: photo_gallery
      POSTGRES_DB: photo_gallery
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=en_US.UTF-8
    ports:
      - "5435:5432"
    volumes:
      - ./db/data:/var/lib/postgresql
  garage:
    image: dxflrs/garage:v2.2.0
    ports:
      - "3900:3900"  # S3 API
      - "3902:3902"  # Web API
      - "3903:3903"  # Admin API
    volumes:
      - ./garage/garage.toml:/etc/garage.toml
      - ./garage/meta:/var/lib/garage/meta
      - ./garage/data:/var/lib/garage/data
